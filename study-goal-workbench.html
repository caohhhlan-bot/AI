<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="目标管理台">
<title>学习目标管理台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f6f7fc; --bg2:#eef0f9; --surface:#ffffff; --line:#e7e9f4; --line2:#f0f2f9;
  --text:#1b1d2b; --t2:#5c6178; --t3:#8f94ab;
  --pp:#7c5cff; --pp2:#a78bfa; --pp-soft:#f2eeff; --pp-line:#ddd3ff;
  --grad:linear-gradient(135deg,#7c5cff 0%,#a78bfa 100%);
  --grad-soft:linear-gradient(135deg,#f5f1ff 0%,#faf7ff 100%);
  --gr:#0fae6a; --gr-soft:#e7f8f0; --gr-line:#b9ecd4;
  --rd:#e5484d; --rd-soft:#fdeeee; --rd-line:#f8c9ca;
  --am:#e08600; --am-soft:#fff5e2; --am-line:#ffdfa8;
  --r:16px; --r2:12px; --r3:10px;
  --sh:0 1px 2px rgba(27,29,43,.04),0 6px 18px rgba(27,29,43,.05);
  --sh2:0 10px 40px rgba(27,29,43,.12);
  --sb:236px;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;font-size:16px}
.ic{flex:none;vertical-align:middle}
.hide{display:none !important}

/* ============ 布局骨架 ============ */
.app{min-height:100%;display:flex;flex-direction:column}
.sidebar{display:none}
.topnav{display:none}
.main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:14px 14px 96px}
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-item{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t3);font-size:11px;font-weight:600}
.bnav-item.on{color:var(--pp)}
.bnav-item.on .bdot{opacity:1}
.bdot{width:16px;height:3px;border-radius:3px;background:var(--pp);opacity:0;position:absolute;top:0}
.bnav-item{position:relative}

/* ============ 通用 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.pagehead h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.pagehead .sub{font-size:12.5px;color:var(--t3);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--r2);font-size:14.5px;font-weight:700;transition:.16s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn-pp{background:var(--grad);color:#fff;box-shadow:0 5px 16px rgba(124,92,255,.32)}
.btn-gh{background:var(--surface);border:1px solid var(--line);color:var(--t2)}
.btn-gh:hover{border-color:var(--pp-line);color:var(--pp)}
.btn-soft{background:var(--pp-soft);color:var(--pp);border:1px solid var(--pp-line)}
.btn-rd{background:var(--rd);color:#fff}
.btn-rd-gh{background:#fff;border:1px solid var(--rd-line);color:var(--rd)}
.btn-sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--bg2);color:var(--t2)}
.tag-pp{background:var(--pp-soft);color:var(--pp)}
.tag-gr{background:var(--gr-soft);color:var(--gr)}
.tag-rd{background:var(--rd-soft);color:var(--rd)}
.tag-am{background:var(--am-soft);color:var(--am)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--t2);letter-spacing:.3px;margin:22px 2px 10px}
.sec-title .line{flex:1;height:1px;background:var(--line)}
.muted{color:var(--t3);font-size:13px}
.empty{text-align:center;padding:34px 18px;color:var(--t3);font-size:13.5px}
.empty svg{color:var(--pp2);opacity:.5;margin-bottom:8px}

/* ============ 备份横幅 ============ */
.banner{
  display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;
  background:var(--grad-soft);border:1px solid var(--pp-line);border-radius:var(--r);
}
.banner .bi{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--pp);flex:none;border:1px solid var(--pp-line)}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13.5px;font-weight:800}
.banner .bt span{font-size:12px;color:var(--t2)}
.banner .bx{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex:none}

/* ============ 今天要处理 ============ */
.today-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.today-head{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.today-head .th-ic{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center}
.today-head b{font-size:15px;font-weight:800;letter-spacing:-.2px}
.today-head .cnt{margin-left:auto;font-size:12px;font-weight:800;color:var(--t3)}
.today-list{padding:10px;display:flex;flex-direction:column;gap:10px}
.trow{border-radius:var(--r2);border:1px solid var(--line);padding:12px 13px;background:#fff}
.trow.red{background:var(--rd-soft);border-color:var(--rd-line)}
.trow.amber{background:var(--am-soft);border-color:var(--am-line)}
.trow.plain{background:#fbfbfe}
.trow-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow-top .nm{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.trow-why{font-size:12.5px;color:var(--t2);margin-top:6px;line-height:1.5;display:flex;gap:6px;align-items:flex-start}
.trow-why b{font-weight:800}
.trow-why.red-t{color:#b23438}
.trow-why.am-t{color:#9a6100}
.trow-plan{margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.72);border:1px dashed var(--line);font-size:12px;color:var(--t2);line-height:1.5}
.trow-plan b{color:var(--pp);font-weight:800}
.trow-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.done-note{display:flex;align-items:center;gap:10px;padding:16px;color:var(--gr);font-weight:700;font-size:14px;background:var(--gr-soft);border-radius:var(--r2);border:1px solid var(--gr-line)}

/* ============ 目标卡 ============ */
.goals-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative}
.gcard.pin{border-color:var(--am-line)}
.gcard.pin.red{border-color:var(--rd-line)}
.gc-bar{height:4px;background:var(--grad)}
.gc-body{padding:14px}
.gc-head{display:flex;align-items:flex-start;gap:10px}
.gc-title{flex:1;min-width:0}
.gc-title h3{font-size:16px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.gc-meta{font-size:12px;color:var(--t3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.gc-ops{display:flex;gap:4px;flex:none}
.iconbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--t3);border:1px solid transparent}
.iconbtn:hover{background:var(--bg2);color:var(--pp)}
.iconbtn.dg:hover{background:var(--rd-soft);color:var(--rd)}
.prog{margin-top:12px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--t2);margin-bottom:6px}
.prog-top b{font-size:15px;color:var(--text);font-weight:800}
.pbar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{background:#fafbff;border:1px solid var(--line2);border-radius:var(--r3);padding:9px 8px;text-align:center}
.st .k{font-size:10.5px;color:var(--t3);font-weight:700;letter-spacing:.2px}
.st .v{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.st .v small{font-size:11px;font-weight:700;color:var(--t3)}
.st.ok .v{color:var(--gr)} .st.bad .v{color:var(--rd)} .st.na .v{font-size:13px;color:var(--t3)}
.suggest{margin-top:12px;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r2);background:var(--pp-soft);border:1px solid var(--pp-line)}
.suggest .sg-t{flex:1;font-size:12.5px;color:var(--t2)}
.suggest .sg-t b{display:block;font-size:17px;color:var(--pp);font-weight:800;letter-spacing:-.4px}
.plan-box{margin-top:10px;border-radius:var(--r2);background:#fbfaff;border:1px solid var(--line2);padding:10px 11px;font-size:12.5px;line-height:1.55;color:var(--t2)}
.plan-box .pl{display:flex;gap:7px;align-items:flex-start}
.plan-box .pl+.pl{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.plan-box .pl svg{margin-top:2px;flex:none}
.plan-box .pl.ob svg{color:var(--am)} .plan-box .pl.cp svg{color:var(--gr)}
.gc-foot{display:flex;gap:8px;margin-top:12px}

/* ============ 看板 ============ */
.board-grid{display:grid;grid-template-columns:1fr;gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.bc-head{display:flex;gap:14px;align-items:center}
.ringwrap{flex:none;position:relative;width:96px;height:96px}
.ringwrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .rt b{font-size:19px;font-weight:800;letter-spacing:-.6px}
.ringwrap .rt span{font-size:10px;color:var(--t3);font-weight:700}
.bc-info{flex:1;min-width:0}
.bc-info h3{font-size:16.5px;font-weight:800;letter-spacing:-.3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.logs{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.logs .lh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--t2);margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;font-size:13px}
.lrow:nth-child(odd){background:#fafbff}
.lrow .ld{font-variant-numeric:tabular-nums;color:var(--t2);font-size:12.5px;font-weight:600;flex:none}
.lrow .la{font-weight:800}
.lrow .lm{color:var(--t3);font-size:12px}
.lrow .lx{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex:none}
.lrow .lx:hover{background:var(--rd-soft);color:var(--rd)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.legend span{font-size:12px;color:var(--t2);font-weight:600;display:inline-flex;align-items:center}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ 周报 ============ */
.wk-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wk-nav .wkt{flex:1;text-align:center;font-size:14px;font-weight:800}
.wk-nav .wkt small{display:block;font-size:11.5px;color:var(--t3);font-weight:600}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--sh)}
.sum .k{font-size:11.5px;color:var(--t3);font-weight:700}
.sum .v{font-size:22px;font-weight:800;letter-spacing:-.8px;margin-top:2px}
.delta{font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
.delta.up{color:var(--gr)} .delta.dn{color:var(--rd)} .delta.fl{color:var(--t3)}
.wtable{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wt-row{padding:12px 14px;border-bottom:1px solid var(--line2)}
.wt-row:last-child{border-bottom:0}
.wt-row .n{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.wt-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.wt-cells .c{background:#fafbff;border:1px solid var(--line2);border-radius:9px;padding:7px 8px}
.wt-cells .c .k{font-size:10.5px;color:var(--t3);font-weight:700}
.wt-cells .c .v{font-size:14.5px;font-weight:800;margin-top:1px}
.four{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--sh)}
.fbox label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:8px}
.fbox textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfbfe;font-size:16px;line-height:1.5;outline:0}
.fbox textarea:focus{border-color:var(--pp);background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.1)}
.fbox.k1 label{color:var(--gr)} .fbox.k2 label{color:var(--rd)} .fbox.k3 label{color:var(--pp)} .fbox.k4 label{color:var(--am)}
.report-out{width:100%;min-height:220px;border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:#fbfbfe;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre-wrap;outline:0;resize:vertical}

/* ============ 我的 ============ */
.mrow{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mrow .mi{width:38px;height:38px;border-radius:11px;background:var(--pp-soft);color:var(--pp);display:flex;align-items:center;justify-content:center;flex:none}
.mrow.dg .mi{background:var(--rd-soft);color:var(--rd)}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:14.5px;font-weight:800}
.mrow .mt span{font-size:12px;color:var(--t3);line-height:1.5;display:block}
.steps{counter-reset:s}
.step{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.step:last-child{border-bottom:0}
.step .no{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step .sx{font-size:13.5px;line-height:1.6;color:var(--t2)}
.step .sx b{color:var(--text);font-weight:800}
.danger-zone{border:1px solid var(--rd-line);background:var(--rd-soft);border-radius:var(--r);padding:14px;margin-top:14px}
.danger-zone h4{font-size:14px;font-weight:800;color:var(--rd);display:flex;align-items:center;gap:7px}
.danger-zone p{font-size:12.5px;color:#94393c;margin:6px 0 10px;line-height:1.55}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-height:44px;border:1px solid var(--rd-line);border-radius:10px;padding:0 12px;background:#fff;outline:0}
.stat-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-mini .s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px;text-align:center;box-shadow:var(--sh)}
.stat-mini .s b{display:block;font-size:20px;font-weight:800;letter-spacing:-.6px}
.stat-mini .s span{font-size:11.5px;color:var(--t3);font-weight:700}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;z-index:100;background:rgba(20,22,38,.42);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--sh2);animation:up .24s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line2)}
.m-head b{flex:1;font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.m-body{padding:14px 16px}
.m-foot{display:flex;gap:10px;padding:12px 16px 16px;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line2)}
.m-foot .btn{flex:1}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--t2);margin-bottom:6px}
.field label .op{font-weight:600;color:var(--t3)}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfbfe;outline:0;transition:.15s}
.field textarea{min-height:66px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pp);background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.1)}
.field .hint{font-size:11.5px;color:var(--t3);margin-top:5px;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{display:flex;gap:9px;flex-wrap:wrap}
.swatch button{width:38px;height:38px;border-radius:11px;border:2px solid transparent;position:relative}
.swatch button.on{border-color:var(--text);transform:scale(1.06)}
.swatch button i{position:absolute;inset:3px;border-radius:8px;display:block}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.chip{height:34px;padding:0 12px;border-radius:9px;background:var(--bg2);font-size:13px;font-weight:700;color:var(--t2);border:1px solid transparent}
.chip.on{background:var(--pp-soft);color:var(--pp);border-color:var(--pp-line)}
.confirm-text{font-size:14px;line-height:1.65;color:var(--t2)}
.confirm-text b{color:var(--text);font-weight:800}
.warnbox{background:var(--rd-soft);border:1px solid var(--rd-line);border-radius:11px;padding:11px 12px;font-size:12.5px;color:#94393c;line-height:1.55;margin-top:10px}

/* ============ 提示 & 彩带 ============ */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);z-index:200;background:rgba(24,26,42,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:.24s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0) scale(1);opacity:1}100%{transform:translateY(112vh) rotate(760deg) scale(.85);opacity:.15}}
.celebrate{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.85);z-index:301;background:#fff;border-radius:18px;padding:22px 26px;text-align:center;box-shadow:var(--sh2);border:1px solid var(--pp-line);animation:pop .4s cubic-bezier(.2,1.2,.3,1) forwards;pointer-events:none}

/* ---------- 日期工具 ---------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ var a=s.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function today(){ return fmt(new Date()); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function mondayOf(s){ var d=parseD(s); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return fmt(d); }
function cnDate(s){ var a=s.split('-'); return (+a[1])+'月'+(+a[2])+'日'; }
var WDN=['一','二','三','四','五','六','日'];
function weekdayCN(s){ var d=parseD(s); return '周'+WDN[(d.getDay()+6)%7]; }
function isoWeekNo(s){
  var d=parseD(s); var t=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  var w1=new Date(t.getFullYear(),0,4);
  return 1 + Math.round(((t-w1)/86400000 - 3 + ((w1.getDay()+6)%7))/7);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nfmt(n){
  n = Math.round(n*10)/10;
  return (n % 1 === 0) ? String(n) : n.toFixed(1);
}

function migrate(d){
  if (!d || typeof d !== 'object') return seed();
  var v = d.version || 1;
  if (!Array.isArray(d.goals)) d.goals = [];
  if (!Array.isArray(d.logs)) d.logs = [];
  // v1 → v2：目标补齐配色 / 障碍预案 / 创建日；记录补齐 id、分钟、补记标记
  if (v < 2){
    d.goals.forEach(function(g){
      if (!g.id) g.id = uid();
      if (!g.color) g.color = 'purple';
      if (g.obstacle == null) g.obstacle = '';
      if (g.counter == null) g.counter = g.plan || '';
      if (!g.createdAt) g.createdAt = g.deadline ? addDays(g.deadline,-30) : today();
      g.total = Number(g.total)||0;
      if (!g.unit) g.unit = '个';
    });
    d.logs.forEach(function(l){
      if (!l.id) l.id = uid();
      if (l.minutes == null) l.minutes = 0;
      if (l.backfill == null) l.backfill = false;
      if (!l.at) l.at = l.date ? parseD(l.date).getTime() : Date.now();
      l.amount = Number(l.amount)||0;
    });
    v = 2;
  }
  // v2 → v3：新增周复盘四栏 + 设置项
  if (v < 3){
    if (!d.reviews || typeof d.reviews !== 'object') d.reviews = {};
    if (!d.settings || typeof d.settings !== 'object') d.settings = {};
    if (d.settings.bannerDismissAt == null) d.settings.bannerDismissAt = 0;
    v = 3;
  }
  if (!d.reviews) d.reviews = {};
  if (!d.settings) d.settings = { bannerDismissAt:0 };
  d.version = CUR_VER;
  return d;
}

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (!raw){
    for (var i=0;i<LEGACY_KEYS.length;i++){
      try {
        var r = localStorage.getItem(LEGACY_KEYS[i]);
        if (r){ raw = r; break; }
      } catch(e){}
    }
  }
  if (!raw) return seed();
  try { return migrate(JSON.parse(raw)); }
  catch(e){ return seed(); }
}

    var r=await fetch(apiCfg.url+'/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ json: DB })
    });

/* =====================================================================
   核心算法
   ===================================================================== */
function logsOf(gid){
  return DB.logs.filter(function(l){ return l.goalId===gid; });
}
function doneOf(gid){
  return logsOf(gid).reduce(function(s,l){ return s + (Number(l.amount)||0); }, 0);
}
function dateSetOf(gid){
  var s = {};
  DB.logs.forEach(function(l){ if (l.goalId===gid && Number(l.amount)>0) s[l.date]=1; });
  return s;
}

/* 今日建议量 = 剩余量 ÷ 剩余天数（含今天，向上取整） */
function suggestToday(g){
  var remain = Math.max(0, g.total - doneOf(g.id));
  if (remain <= 0) return 0;
  var left = diffDays(today(), g.deadline) + 1;
  if (left <= 1) return remain;
  return Math.max(1, Math.ceil(remain / left));
}

/* 连续打卡天数：每个自然周（周一起）自动使用 1 个休息日，
   本周第一次漏打卡不中断，第二次才断。休息日本身不计入天数。 */
function streakOf(g){
  var has = dateSetOf(g.id);
  var t = today();
  var cursor = has[t] ? t : addDays(t,-1);
  var streak = 0, rest = {}, guard = 0, restYesterday = false;
  var start = g.createdAt || '2000-01-01';
  var yd = addDays(t,-1);
  while (guard++ < 500){
    if (cursor < start) break;
    if (has[cursor]) { streak++; }
    else {
      var wk = mondayOf(cursor);
      if (!rest[wk]) { rest[wk] = 1; if (cursor === yd) restYesterday = true; }
      else break;
    }
    cursor = addDays(cursor, -1);
  }
  return { streak: streak, restYesterday: restYesterday };
}

/* 近 7 天平均速度推算预计完成日；有记录的天数 < 2 视为样本不足 */
function forecastOf(g){
  var t = today(), from = addDays(t,-6);
  var rec = DB.logs.filter(function(l){
    return l.goalId===g.id && l.date>=from && l.date<=t && Number(l.amount)>0;
  });
  var days = {}; rec.forEach(function(l){ days[l.date]=1; });
  var dayCount = Object.keys(days).length;
  var remain = Math.max(0, g.total - doneOf(g.id));
  if (remain <= 0) return { ok:true, finished:true };
  if (dayCount < 2) return { ok:false, reason:'样本不足', dayCount:dayCount };
  var sum = rec.reduce(function(s,l){ return s+Number(l.amount); }, 0);
  var rate = sum / 7;
  if (rate <= 0) return { ok:false, reason:'样本不足', dayCount:dayCount };
  var need = Math.ceil(remain / rate);
  if (need > 3650) return { ok:false, reason:'速度过慢', dayCount:dayCount };
  var eta = addDays(t, need);
  return { ok:true, eta:eta, rate:rate, gap:diffDays(eta, g.deadline), dayCount:dayCount };
}

/* 目标当前状态汇总 */
function stateOf(g){
  var done = doneOf(g.id);
  var remain = Math.max(0, g.total - done);
  var pct = g.total>0 ? Math.min(100, done/g.total*100) : 0;
  var t = today();
  var overdue = diffDays(g.deadline, t);   // >0 表示逾期天数
  var si = streakOf(g);
  var has = dateSetOf(g.id);
  var yd = addDays(t,-1);
  var missedYesterday = !has[yd] && (g.createdAt||'2000-01-01') <= yd && remain>0;
  var flag = 'none';
  if (remain <= 0) flag = 'done';
  else if (missedYesterday && si.streak > 0) flag = 'rest';   // 温和黄卡：本周休息日自动顶上
  else if (missedYesterday) flag = 'roll';                    // 红卡：昨天的量滚入今天
  return {
    goal:g, done:done, remain:remain, pct:pct,
    finished: remain<=0,
    overdueDays: overdue>0 ? overdue : 0,
    isOverdue: overdue>0 && remain>0,
    streak: si.streak,
    flag: flag,
    todayLogged: !!has[t],
    todaySum: DB.logs.filter(function(l){return l.goalId===g.id && l.date===t;}).reduce(function(s,l){return s+Number(l.amount);},0),
    suggest: suggestToday(g),
    fc: forecastOf(g)
  };
}
function sortStates(list){
  var rank = { roll:0, rest:1, none:2, done:3 };
  return list.slice().sort(function(a,b){
    if (a.isOverdue !== b.isOverdue) return a.isOverdue ? -1 : 1;
    if (rank[a.flag] !== rank[b.flag]) return rank[a.flag]-rank[b.flag];
    if (a.todayLogged !== b.todayLogged) return a.todayLogged ? 1 : -1;
    return diffDays(today(), a.goal.deadline) - diffDays(today(), b.goal.deadline);
  });
}

/* =====================================================================
   进度环 / 柱状图（全部手写内联 SVG）
   ===================================================================== */
function ringSVG(pct, colorKey, size){
  size = size||96;
  var sw=9, r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,pct/100));
  var p=pal(colorKey), gid='rg_'+colorKey+'_'+size;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0%" stop-color="'+p.a+'"/><stop offset="100%" stop-color="'+p.b+'"/></linearGradient></defs>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#eef0f9" stroke-width="'+sw+'"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="url(#'+gid+')" stroke-width="'+sw+'" '+
      'stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" '+
      'transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'+
  '</svg>';
}

/* 近 14 天分目标堆叠柱状图：只统计填了分钟数的记录，未填的不硬凑 */
function stackChartSVG(){
  var t=today(), days=[], i;
  for(i=13;i>=0;i--) days.push(addDays(t,-i));
  var goals=DB.goals;
  var data=days.map(function(d){
    var parts=goals.map(function(g){
      var m=DB.logs.filter(function(l){ return l.goalId===g.id && l.date===d && Number(l.minutes)>0; })
                   .reduce(function(s,l){ return s+Number(l.minutes); },0);
      return { g:g, m:m };
    });
    return { date:d, parts:parts, total:parts.reduce(function(s,p){return s+p.m;},0) };
  });
  var max=Math.max.apply(null, data.map(function(d){return d.total;}).concat([30]));
  var step=Math.ceil(max/4/15)*15 || 15; var top=step*4;
  var W=700,H=228, padL=42,padR=10,padT=12,padB=34;
  var cw=(W-padL-padR)/14, bw=Math.min(26, cw*0.58);
  var s='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="min-width:640px">';
  s+='<defs>';
  goals.forEach(function(g){
    var p=pal(g.color);
    s+='<linearGradient id="bg_'+g.id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+p.b+'"/><stop offset="100%" stop-color="'+p.a+'"/></linearGradient>';
  });
  s+='</defs>';
  for(i=0;i<=4;i++){
    var v=step*i, y=padT+(H-padT-padB)*(1-v/top);
    s+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef0f9" stroke-width="1"/>';
    s+='<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#8f94ab" font-family="inherit">'+v+'</text>';
  }
  data.forEach(function(d,idx){
    var x=padL+cw*idx+(cw-bw)/2, acc=0;
    d.parts.forEach(function(p){
      if(p.m<=0) return;
      var h=(H-padT-padB)*(p.m/top);
      var y=padT+(H-padT-padB)-(acc+h);
      acc+=h;
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1.5,h).toFixed(1)+'" rx="3" fill="url(#bg_'+p.g.id+')"><title>'+esc(cnDate(d.date)+' · '+p.g.name+' '+p.m+' 分钟')+'</title></rect>';
    });
    if(d.total>0){
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(padT+(H-padT-padB)-acc-5).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#5c6178" font-family="inherit">'+d.total+'</text>';
    }
    var isT = d.date===t;
    s+='<text x="'+(padL+cw*idx+cw/2).toFixed(1)+'" y="'+(H-padB+16)+'" text-anchor="middle" font-size="10" fill="'+(isT?'#7c5cff':'#8f94ab')+'" font-weight="'+(isT?'800':'600')+'" font-family="inherit">'+(+d.date.split('-')[2])+'</text>';
    s+='<text x="'+(padL+cw*idx+cw/2).toFixed(1)+'" y="'+(H-padB+28)+'" text-anchor="middle" font-size="9" fill="'+(isT?'#7c5cff':'#c2c6d6')+'" font-family="inherit">'+weekdayCN(d.date).slice(1)+'</text>';
  });
  s+='<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#e7e9f4" stroke-width="1.2"/>';
  s+='</svg>';
  return { svg:s, any: data.some(function(d){return d.total>0;}) };
}

/* 某天的建议量（用于说明昨天漏掉了多少） */
function suggestOn(g, date){
  var doneBefore = logsOf(g.id).filter(function(l){ return l.date < date; })
                    .reduce(function(s,l){ return s+Number(l.amount); },0);
  var remain=Math.max(0, g.total-doneBefore);
  if (remain<=0) return 0;
  var left=diffDays(date, g.deadline)+1;
  if (left<=1) return remain;
  return Math.max(1, Math.ceil(remain/left));
}

function weekAgg(monday){
  var end=addDays(monday,6);
  var rows=DB.goals.map(function(g){
    var ls=DB.logs.filter(function(l){ return l.goalId===g.id && l.date>=monday && l.date<=end; });
    var days={}; ls.forEach(function(l){ if(Number(l.amount)>0) days[l.date]=1; });
    return {
      goal:g,
      amount: ls.reduce(function(s,l){return s+Number(l.amount);},0),
      days: Object.keys(days).length,
      minutes: ls.reduce(function(s,l){return s+(Number(l.minutes)||0);},0)
    };
  });
  var allDays={};
  DB.logs.forEach(function(l){ if(l.date>=monday&&l.date<=end&&Number(l.amount)>0) allDays[l.date]=1; });
  return {
    monday:monday, end:end, rows:rows,
    totalMinutes: rows.reduce(function(s,r){return s+r.minutes;},0),
    totalDays: Object.keys(allDays).length,
    totalLogs: DB.logs.filter(function(l){return l.date>=monday&&l.date<=end;}).length
  };
}
function deltaHTML(cur, prev, unit){
  var d=cur-prev;
  if (prev===0 && cur===0) return '<span class="delta fl">'+icon('info',12)+'与上周持平（都是 0）</span>';
  if (d===0) return '<span class="delta fl">与上周持平</span>';
  var pctTxt = prev>0 ? '（'+(d>0?'+':'-')+Math.abs(Math.round(d/prev*100))+'%）' : '（上周为 0）';
  return '<span class="delta '+(d>0?'up':'dn')+'">'+icon(d>0?'up':'down',12)+nfmt(Math.abs(d))+' '+unit+pctTxt+'</span>';
}

function buildReport(){
  var cur=weekAgg(state.weekStart), prev=weekAgg(addDays(state.weekStart,-7));
  var rv=DB.reviews[state.weekStart]||{};
  function dtxt(c,p,u){
    var d=c-p;
    if(d===0) return '（与上周持平）';
    return '（上周 '+nfmt(p)+' '+u+'，'+(d>0?'↑ ':'↓ ')+nfmt(Math.abs(d))+' '+u+(p>0?'，'+(d>0?'+':'-')+Math.abs(Math.round(d/p*100))+'%':'')+'）';
  }
  var L=[];
  L.push('【学习周报】'+state.weekStart.slice(0,4)+' 年第 '+isoWeekNo(state.weekStart)+' 周');
  L.push(cur.monday+' ~ '+cur.end);
  L.push('');
  L.push('一、总览');
  L.push('· 打卡天数：'+cur.totalDays+' / 7 天 '+dtxt(cur.totalDays,prev.totalDays,'天'));
  L.push('· 打卡笔数：'+cur.totalLogs+' 笔 '+dtxt(cur.totalLogs,prev.totalLogs,'笔'));
  L.push('· 投入时长：'+cur.totalMinutes+' 分钟 '+dtxt(cur.totalMinutes,prev.totalMinutes,'分钟'));
  L.push('');
  L.push('二、分目标进度');
  cur.rows.forEach(function(r,i){
    var p=prev.rows[i]||{amount:0,days:0,minutes:0};
    var s=stateOf(r.goal), f=fcText(s);
    L.push('· '+r.goal.name);
    L.push('  本周 '+nfmt(r.amount)+' '+r.goal.unit+' '+dtxt(r.amount,p.amount,r.goal.unit)+'；打卡 '+r.days+' 天'+dtxt(r.days,p.days,'天')+'；'+r.minutes+' 分钟');
    L.push('  累计 '+nfmt(s.done)+'/'+nfmt(r.goal.total)+' '+r.goal.unit+'（'+s.pct.toFixed(1)+'%），连续 '+s.streak+' 天');
    L.push('  预计完成：'+(f.tail? f.v+'（'+f.tail+'）' : f.v)+'；截止 '+r.goal.deadline+(s.isOverdue?'，已逾期 '+s.overdueDays+' 天':''));
  });
  L.push('');
  L.push('三、保持');   L.push(rv.keep ? rv.keep : '（未填写）');
  L.push('');
  L.push('四、问题');   L.push(rv.problem ? rv.problem : '（未填写）');
  L.push('');
  L.push('五、尝试');   L.push(rv.tryIt ? rv.tryIt : '（未填写）');
  L.push('');
  L.push('六、下周预案'); L.push(rv.next ? rv.next : '（未填写）');
  return L.join('\n');
}

function exportJSON(){
  var payload=JSON.stringify(DB,null,2);
  var blob=new Blob([payload],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='学习目标管理台备份_'+today()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },600);
  toast('备份已导出，共 '+DB.logs.length+' 条记录');
  DB.settings.bannerDismissAt = DB.logs.length; save(); render();
}
function handleImportFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    var parsed;
    try { parsed=JSON.parse(fr.result); }
    catch(e){ toast('文件不是合法的 JSON'); return; }
    if(!parsed || !Array.isArray(parsed.goals)){ toast('这个文件里没有目标数据'); return; }
    var gN=parsed.goals.length, lN=Array.isArray(parsed.logs)?parsed.logs.length:0;
    var oldV=parsed.version||1;
    window.__pendingImport=parsed;
    confirmBox({
      title:'确认覆盖导入',
      icon:'up',
      text:'备份里有 <b>'+gN+' 个目标</b>、<b>'+lN+' 条记录</b>（数据版本 v'+oldV+'）。'+
           (oldV<CUR_VER? '<br>导入时会自动迁移到最新格式 v'+CUR_VER+'。':''),
      warn:'导入会<b>完全覆盖</b>当前的 '+DB.goals.length+' 个目标和 '+DB.logs.length+' 条记录，无法撤销。建议先导出一份现有数据。',
      okText:'覆盖导入', danger:true,
      onOk:function(){
        DB=migrate(window.__pendingImport);
        save(); closeModal(); render();
        toast('导入成功：'+DB.goals.length+' 个目标 / '+DB.logs.length+' 条记录');
      }
    });
  };
  fr.readAsText(file);
}

/* =====================================================================
   GitHub 永久备份（数据写进仓库，Git 版本化存档）
   ===================================================================== */
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function b64encodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decodeUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }
function ghApi(path, token, method, body){
  var opt={ headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json',
    'User-Agent':'study-goal-workbench', 'X-GitHub-Api-Version':'2022-11-28' } };
  if(method){ opt.method=method; opt.headers['Content-Type']='application/json'; opt.body=body; }
  return fetch('https://api.github.com/'+path, opt);
}
function setGhStatus(msg, kind){
  var el=document.getElementById('ghStatus');
  if(!el) return;
  el.className='gh-status'+(kind?(' '+kind):'');
  el.innerHTML=msg;
}
function ghReadInputs(){
  ghCfg.repo=(document.getElementById('gh_repo').value||'').trim();
  ghCfg.branch=(document.getElementById('gh_branch').value||'').trim()||'main';
  ghCfg.file=(document.getElementById('gh_file').value||'').trim()||'study-goal-data.json';
  ghCfg.token=document.getElementById('gh_token').value;
  saveGh();
}
function backupToGitHub(){
  ghReadInputs();
  if(!ghCfg.repo || !ghCfg.repo.match(/^[\w.-]+\/[\w.-]+$/)){ toast('请填写正确的仓库：owner/repo'); return; }
  if(!ghCfg.token){ toast('请填写 GitHub Token'); return; }
  var enc='repos/'+encodeURIComponent(ghCfg.repo)+'/contents/'+encodeURIComponent(ghCfg.file);
  var ref=encodeURIComponent(ghCfg.branch);
  setGhStatus('正在读取仓库现有文件…','');
  ghApi(enc+'?ref='+ref, ghCfg.token).then(function(r){
    if(r.status===200){ return r.json().then(function(j){ return putGh(enc, ref, j.sha); }); }
    if(r.status===404){ return putGh(enc, ref, null); }
    if(r.status===401){ setGhStatus('Token 无效或没有 repo 权限（401）','err'); toast('Token 无效'); return; }
    if(r.status===403){ setGhStatus('没有权限，或触发了 API 速率限制（403）','err'); toast('被拒绝'); return; }
    setGhStatus('读取仓库失败：HTTP '+r.status,'err');
  }).catch(function(e){ setGhStatus('网络错误：'+e.message,'err'); });
}
function putGh(enc, ref, sha){
  var content=b64encodeUtf8(JSON.stringify(DB,null,2));
  var body={ message:'study-goal 备份 '+today()+' '+nowHM(), content:content, branch:ghCfg.branch };
  if(sha) body.sha=sha;
  setGhStatus('正在写入 '+esc(ghCfg.file)+' …','');
  return ghApi(enc, ghCfg.token, 'PUT', JSON.stringify(body)).then(function(r){
    if(r.status===200||r.status===201){
      return r.json().then(function(j){
        setGhStatus('已备份到 GitHub ✔ <a href="'+j.commit.html_url+'" target="_blank" rel="noopener">查看 commit</a>','ok');
        toast('已备份到 GitHub');
      });
    }
    if(r.status===409){ // 并发冲突：重新取 SHA 后重试一次
      return ghApi(enc+'?ref='+ref, ghCfg.token).then(function(r2){
        return r2.json().then(function(j2){ return putGh(enc, ref, j2.sha); });
      });
    }
    if(r.status===401){ setGhStatus('Token 无效或没有 repo 权限（401）','err'); toast('Token 无效'); return; }
    return r.json().catch(function(){return{};}).then(function(j){
      setGhStatus('写入失败：'+(j.message||('HTTP '+r.status)),'err'); toast('写入失败');
    });
  }).catch(function(e){ setGhStatus('网络错误：'+e.message,'err'); });
}
function restoreFromGitHub(){
  ghReadInputs();
  if(!ghCfg.repo || !ghCfg.repo.match(/^[\w.-]+\/[\w.-]+$/)){ toast('请填写正确的仓库：owner/repo'); return; }
  if(!ghCfg.token){ toast('请填写 GitHub Token'); return; }
  var enc='repos/'+encodeURIComponent(ghCfg.repo)+'/contents/'+encodeURIComponent(ghCfg.file)+'?ref='+encodeURIComponent(ghCfg.branch);
  setGhStatus('正在从仓库读取数据…','');
  ghApi(enc, ghCfg.token).then(function(r){
    if(r.status===404){ setGhStatus('仓库里还没有这个文件，先备份一次','err'); toast('没有可恢复的数据'); return; }
    if(r.status===401){ setGhStatus('Token 无效或没有 repo 权限（401）','err'); toast('Token 无效'); return; }
    if(!r.ok){ setGhStatus('读取失败：HTTP '+r.status,'err'); return; }
    r.json().then(function(j){
      var parsed;
      try { parsed=JSON.parse(b64decodeUtf8(j.content)); } catch(e){ setGhStatus('文件内容不是合法 JSON','err'); return; }
      if(!parsed || !Array.isArray(parsed.goals)){ setGhStatus('这个文件里没有目标数据','err'); return; }
      var gN=parsed.goals.length, lN=Array.isArray(parsed.logs)?parsed.logs.length:0, oldV=parsed.version||1;
      window.__pendingImport=parsed;
      confirmBox({ title:'确认覆盖恢复', danger:true, okText:'覆盖恢复', icon:'down',
        text:'GitHub 上有 <b>'+gN+' 个目标</b>、<b>'+lN+' 条记录</b>（v'+oldV+'）。',
        warn:'会完全覆盖当前数据，不可撤销。建议先导出一份本地备份。',
        onOk:function(){
          DB=migrate(window.__pendingImport); save(); closeModal(); render();
          setGhStatus('已从 GitHub 恢复 ✔','ok'); toast('恢复成功');
        }});
    });
  }).catch(function(e){ setGhStatus('网络错误：'+e.message,'err'); });
}

/* =====================================================================
   事件
   ===================================================================== */
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id'), v=el.getAttribute('data-v');

  if(act==='tab'){ state.tab=el.getAttribute('data-k'); render(); return; }
  if(act==='closeModal'){ closeModal(); return; }
  if(act==='confirmOk'){ if(window.__confirmFn) window.__confirmFn(); return; }
  if(act==='newGoal'){ goalForm(null); return; }
  if(act==='editGoal'){ goalForm(id); return; }
  if(act==='checkin'){ checkinForm(id); return; }
  if(act==='dismissBanner'){ DB.settings.bannerDismissAt=DB.logs.length; save(); renderBanner(); return; }
  if(act==='exportJSON'){ exportJSON(); return; }

  if(act==='pickUnit'){
    document.getElementById('f_unit').value=v;
    Array.prototype.forEach.call(el.parentNode.children,function(c){c.classList.remove('on');});
    el.classList.add('on'); return;
  }
  if(act==='pickColor'){
    Array.prototype.forEach.call(el.parentNode.children,function(c){c.classList.remove('on');});
    el.classList.add('on'); return;
  }

  if(act==='saveGoal'){
    var name=document.getElementById('f_name').value.trim();
    var total=parseFloat(document.getElementById('f_total').value);
    var unit=document.getElementById('f_unit').value.trim()||'个';
    var dl=document.getElementById('f_deadline').value;
    var colorBtn=document.querySelector('#f_color button.on');
    var color=colorBtn?colorBtn.getAttribute('data-v'):'purple';
    var ob=document.getElementById('f_ob').value.trim();
    var cp=document.getElementById('f_cp').value.trim();
    if(!name){ toast('给目标起个名字'); return; }
    if(!(total>0)){ toast('总量要大于 0'); return; }
    if(!dl){ toast('选一个截止日'); return; }
    var gid=window.__editingGoal;
    if(gid){
      var g=DB.goals.filter(function(x){return x.id===gid;})[0];
      var before=doneOf(gid)>=g.total;
      g.name=name; g.total=total; g.unit=unit; g.deadline=dl; g.color=color; g.obstacle=ob; g.counter=cp;
      save(); closeModal(); render();
      if(!before && doneOf(gid)>=g.total) celebrate(g.name);
      toast('已保存');
    } else {
      DB.goals.push({ id:uid(), name:name, total:total, unit:unit, deadline:dl, color:color,
        obstacle:ob, counter:cp, createdAt:today() });
      save(); closeModal(); render(); toast('目标已创建，开始吧');
    }
    return;
  }

  if(act==='saveCheckin'){
    var g2=DB.goals.filter(function(x){return x.id===window.__checkinGoal;})[0];
    if(!g2){ closeModal(); return; }
    var amt=parseFloat(document.getElementById('c_amt').value);
    var mins=parseFloat(document.getElementById('c_min').value);
    var d=document.getElementById('c_date').value||today();
    if(!(amt>0)){ toast('数量要大于 0'); return; }
    if(d>today()) d=today();
    if(d<addDays(today(),-6)) d=addDays(today(),-6);
    var wasDone=doneOf(g2.id)>=g2.total;
    DB.logs.push({ id:uid(), goalId:g2.id, date:d, amount:amt,
      minutes:(mins>0?Math.round(mins):0), backfill:(d!==today()), at:Date.now() });
    save(); closeModal(); render();
    var nowDone=doneOf(g2.id)>=g2.total;
    if(!wasDone && nowDone) celebrate(g2.name);
    else toast((d!==today()?'已补记 '+cnDate(d)+'：':'已记录：')+'+'+nfmt(amt)+' '+g2.unit);
    return;
  }

  if(act==='delGoal'){
    var dg=DB.goals.filter(function(x){return x.id===id;})[0]; if(!dg) return;
    var n=logsOf(id).length;
    confirmBox({ title:'删除目标', danger:true, okText:'确认删除', icon:'trash',
      text:'确定删除 <b>'+esc(dg.name)+'</b> 吗？',
      warn:'它的 '+n+' 条打卡记录也会一起删掉，无法恢复。',
      onOk:function(){
        DB.goals=DB.goals.filter(function(x){return x.id!==id;});
        DB.logs=DB.logs.filter(function(l){return l.goalId!==id;});
        save(); closeModal(); render(); toast('已删除');
      }});
    return;
  }

  if(act==='delLog'){
    var lg=DB.logs.filter(function(x){return x.id===id;})[0]; if(!lg) return;
    var lgGoal=DB.goals.filter(function(x){return x.id===lg.goalId;})[0];
    confirmBox({ title:'删除这条记录', danger:true, okText:'删除', icon:'trash',
      text:'删除 <b>'+cnDate(lg.date)+'</b> 的 <b>+'+nfmt(lg.amount)+' '+esc(lgGoal?lgGoal.unit:'')+'</b>？连续天数和进度会重新计算。',
      onOk:function(){
        DB.logs=DB.logs.filter(function(x){return x.id!==id;});
        save(); closeModal(); render(); toast('记录已删除');
      }});
    return;
  }

  if(act==='weekPrev'){ state.weekStart=addDays(state.weekStart,-7); render(); return; }
  if(act==='weekNext'){
    if(state.weekStart>=mondayOf(today())) return;
    state.weekStart=addDays(state.weekStart,7); render(); return;
  }
  if(act==='weekToday'){ state.weekStart=mondayOf(today()); render(); return; }
  if(act==='genReport'){
    var out=document.getElementById('reportOut');
    out.value=buildReport(); toast('周报已生成'); return;
  }
  if(act==='copyReport'){
    var o=document.getElementById('reportOut');
    if(!o.value) o.value=buildReport();
    o.select(); o.setSelectionRange(0,999999);
    var ok=false;
    try { ok=document.execCommand('copy'); } catch(err){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(o.value); ok=true; }
    toast(ok?'周报已复制到剪贴板':'复制失败，请手动全选复制');
    return;
  }

  if(act==='pickImport'){ document.getElementById('importFile').click(); return; }
  if(act==='clearSample'){
    confirmBox({ title:'清空示例数据', danger:true, okText:'清空示例', icon:'broom',
      text:'将删除 3 个带「示例」标记的目标和它们的打卡记录。',
      warn:'你自己创建的目标和记录不受影响。',
      onOk:function(){
        DB.goals=DB.goals.filter(function(g){return !g.sample;});
        DB.logs=DB.logs.filter(function(l){return !l.sample;});
        Object.keys(DB.reviews).forEach(function(k){
          if(k==='2026-07-27') delete DB.reviews[k];
        });
        save(); closeModal(); render(); toast('示例数据已清空');
      }});
    return;
  }
  if(act==='wipeAll'){
    var inp=document.getElementById('wipeInput');
    if(!inp || inp.value.trim()!=='清空'){ toast('请先输入「清空」两个字'); return; }
    confirmBox({ title:'清空全部数据', danger:true, okText:'我确定，全部清空', icon:'alert',
      text:'将删除全部 <b>'+DB.goals.length+' 个目标</b>、<b>'+DB.logs.length+' 条记录</b>和所有周复盘。',
      warn:'这个操作<b>不可恢复</b>。如果还没导出过备份，现在关掉弹窗先导出一份。',
      onOk:function(){
        DB={ version:CUR_VER, goals:[], logs:[], reviews:{}, settings:{bannerDismissAt:0} };
        save(); closeModal(); state.tab='today'; render(); toast('已清空，可以从零开始了');
      }});
    return;
  }

  if(act==='ghBackup'){ backupToGitHub(); return; }
  if(act==='ghRestore'){ restoreFromGitHub(); return; }
  if(act==='cloudSync'){
    var url=document.getElementById('api_url').value.trim();
    var key=document.getElementById('api_key').value.trim();
    apiCfg.url=url; apiCfg.anonKey=key; apiCfg.enabled=!!(url && key);
    saveApi();
    if(!apiCfg.enabled){ setApiStatus('请填写 API 地址和密钥','err'); return; }
    setApiStatus('正在同步…','');
    cloudSave().then(function(){ render(); });
    return;
  }
  if(act==='cloudPull'){
    var url=document.getElementById('api_url').value.trim();
    var key=document.getElementById('api_key').value.trim();
    apiCfg.url=url; apiCfg.anonKey=key; apiCfg.enabled=!!(url && key);
    saveApi();
    if(!apiCfg.enabled){ setApiStatus('请填写 API 地址和密钥','err'); return; }
    setApiStatus('正在拉取…','');
    cloudLoad().then(function(cloudData){
      if(cloudData){
        window.__pendingCloud = cloudData;
        confirmBox({ title:'确认覆盖本地数据', okText:'覆盖', icon:'down',
          text:'拉取云端数据会覆盖本地所有目标和打卡记录。',
          warn:'建议先确认哪边数据最新。',
          onOk:function(){
            DB=migrate(window.__pendingCloud); save(); closeModal(); render();
            toast('已从云端拉取');
          }});
      }
    });
    return;
  }
});

/* 周复盘四栏：输入即存 */
var reviewTimer=null;
document.addEventListener('input', function(e){
  var t=e.target;
  if(t.hasAttribute && t.hasAttribute('data-review')){
    var f=t.getAttribute('data-review');
    var k=state.weekStart;
    if(!DB.reviews[k]) DB.reviews[k]={keep:'',problem:'',tryIt:'',next:''};
    DB.reviews[k][f]=t.value;
    clearTimeout(reviewTimer);
    reviewTimer=setTimeout(function(){ save(); },250);
  }
  if(t.id==='gh_repo'||t.id==='gh_branch'||t.id==='gh_file'||t.id==='gh_token'){
    ghCfg.repo=document.getElementById('gh_repo').value.trim();
    ghCfg.branch=document.getElementById('gh_branch').value.trim()||'main';
    ghCfg.file=document.getElementById('gh_file').value.trim()||'study-goal-data.json';
    ghCfg.token=document.getElementById('gh_token').value;
    saveGh();
  }
  if(t.id==='api_url'||t.id==='api_key'){
    apiCfg.url=document.getElementById('api_url').value.trim();
    apiCfg.anonKey=document.getElementById('api_key').value.trim();
    apiCfg.enabled=!!(apiCfg.url && apiCfg.anonKey);
    saveApi();
  }
    saveGh();
  }
  if(t.id==='wipeInput'){
    var b=document.getElementById('wipeBtn');
    if(b) b.disabled = (t.value.trim()!=='清空');
  }
});
document.addEventListener('change', function(e){
  if(e.target.id==='importFile' && e.target.files && e.target.files[0]){
    handleImportFile(e.target.files[0]);
    e.target.value='';
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
  if((e.key==='Enter') && (e.metaKey||e.ctrlKey)){
    var ok=document.querySelector('.m-foot .btn-pp,.m-foot .btn-rd');
    if(ok) ok.click();
  }
});

/* 跨零点自动刷新 */
var lastDay=today();
setInterval(function(){
  if(today()!==lastDay){ lastDay=today(); state.weekStart=mondayOf(today()); render(); }
}, 60000);

render();
</script>
